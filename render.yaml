databases:
  - name: ttg-doc-standardizer-db
    plan: free
    databaseName: ttg_docs
    user: ttg
    region: oregon

services:
  # ---- Backend API (Docker, Express + Postgres) ----
  - type: web
    name: ttg-doc-standardizer-1
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ttg-doc-standardizer-db
          property: connectionString
      # No longer used to store rendered documents — those are stored as
      # bytes in Postgres now, since the free plan's disk is ephemeral and
      # was wiping completed documents on every restart/redeploy. Kept as a
      # harmless no-op env var.
      - key: OUTPUT_DIR
        value: /data/outputs
      # Must exactly match the frontend's origin (no wildcard support in the
      # backend's cors() config, and Render's actual assigned name was
      # ttg-doc-standardizer-2 due to a name collision with the guessed name).
      - key: CORS_ORIGIN
        value: "https://ttg-doc-standardizer-2.onrender.com"
      # Structuring engine — "groq" (best quality, needs GROQ_API_KEY below)
      # > "transformers" (local ONNX model, needs a paid plan's RAM headroom)
      # > "heuristic" (pure-JS keyword routing, no model, lowest memory).
      # Falls back automatically at each level if the one above it fails.
      - key: STRUCTURER
        value: heuristic
      # Only read when STRUCTURER=groq. sync:false means Render will prompt
      # for this in the dashboard instead of storing it in this file — set
      # it there, never commit a real key to source control.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: MAX_UPLOAD_BYTES
        value: "15728640"

  # ---- Frontend (static site, built by Vite) ----
  - type: web
    name: ttg-doc-standardizer-2
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Baked into the JS bundle at build time. Must match the backend
      # service's actual onrender.com URL.
      - key: VITE_API_URL
        value: https://ttg-doc-standardizer-1.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
